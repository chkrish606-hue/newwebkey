<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Store Panel</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f7fb;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#101522;border:1px solid #20293a;border-radius:16px;padding:20px;margin:12px 0}
input,textarea,button,select{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #30394b;background:#0b101a;color:#fff}
button{background:#7c3aed;border:0;font-weight:700;cursor:pointer}.danger{background:#b91c1c}.ok{background:#15803d}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}nav button{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.muted{color:#9aa4b2}.price{font-size:20px;font-weight:700}.hidden{display:none}.key{padding:10px;background:#090d15;border-radius:9px;word-break:break-all;margin:7px 0}
img{max-width:100%;border-radius:12px}.small{font-size:13px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s), api=async(u,o={})=>{o.headers={...(o.headers||{}),...(localStorage.token?{Authorization:"Bearer "+localStorage.token}:{})};let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||"Error");return j};
function shell(body){return `<nav><button onclick="dashboard()">Store</button><button onclick="keys()">My Keys</button><button onclick="deposit()">Add Balance</button><button onclick="profile()">Profile</button>${me.role==="admin"?'<button onclick="admin()">Admin</button>':''}<button onclick="logout()">Logout</button></nav>${body}`}
let me=null;
async function boot(){if(!localStorage.token)return login();try{me=await api("/api/me");dashboard()}catch(e){logout()}}
function login(){app.innerHTML=`<div class="card" style="max-width:430px;margin:70px auto"><h1>Login</h1><p class="muted">Key Store</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="doLogin()">SIGN IN NOW</button><button onclick="register()">CREATE NEW ACCOUNT</button><button onclick="forgot()">Forgot Password?</button><button onclick="googleDemo()">Continue with Google</button><p class="small muted">Google/OTP production integration can be connected later with an OAuth/email provider.</p></div>`}
async function doLogin(){try{let j=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:pass.value})});localStorage.token=j.token;boot()}catch(e){alert(e.message)}}
function register(){app.innerHTML=`<div class="card" style="max-width:430px;margin:70px auto"><h1>Create Account</h1><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password (6+ chars)"><button onclick="doReg()">CREATE ACCOUNT</button><button onclick="login()">Back to Login</button></div>`}
async function doReg(){try{await api("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,password:pass.value})});alert("Account created. Please login.");login()}catch(e){alert(e.message)}}
function forgot(){app.innerHTML=`<div class="card" style="max-width:430px;margin:70px auto"><h1>Forgot Password</h1><input id="email" placeholder="Registered email"><button onclick="sendOtp()">SEND OTP</button><p class="muted small">For the production version, this will send a real OTP to the registered email. This starter keeps the UI ready but does not fake email delivery.</p><button onclick="login()">Back</button></div>`}
function sendOtp(){alert("OTP email service is not configured in this test build. Add an email provider/API key before production.");}
function googleDemo(){alert("Google OAuth needs a Google Client ID/secret and callback URL. We can connect it on Render after you create the credentials.");}
async function dashboard(){let ps=await api("/api/products");app.innerHTML=shell(`<div class="card"><h2>Welcome, ${me.name||me.email}</h2><p>Wallet: ₹${Number(me.wallet).toFixed(2)}</p></div><div class="grid">${ps.map(p=>`<div class="card">${p.image_url?`<img src="${p.image_url}">`:''}<h2>${p.name}</h2><p class="muted">${p.description||''}</p>${(p.plans||[]).map(x=>{let price=me.role==="reseller"?x.reseller_price:x.customer_price;return `<div class="card"><b>${x.name}</b><div class="price">₹${Number(price).toFixed(2)}</div><button onclick="buy(${x.id})">BUY</button></div>`}).join("")}</div>`).join("")||'<div class="card">No products yet.</div>'}</div>`)}
async function buy(id){try{let j=await api("/api/purchase",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({plan_id:id})});alert("Purchase successful. Key: "+j.key);me=await api("/api/me");dashboard()}catch(e){alert(e.message)}}
async function keys(){let ks=await api("/api/keys");app.innerHTML=shell(`<div class="card"><h2>My Keys</h2>${ks.map(k=>`<div class="card"><b>${k.product}</b><div class="key">${k.secret_key}</div></div>`).join("")||'<p class="muted">No keys yet.</p>'}</div>`)}
function deposit(){app.innerHTML=shell(`<div class="card"><h2>Add Balance</h2><p>Admin UPI/QR details can be shown here. Enter amount, UTR and payment screenshot.</p><input id="amount" type="number" placeholder="Amount"><input id="utr" placeholder="UTR / Transaction ID"><input id="shot" type="file" accept="image/*"><button onclick="sendDeposit()">SEND DEPOSIT REQUEST</button></div>`)}
async function sendDeposit(){let f=new FormData();f.append("amount",amount.value);f.append("utr",utr.value);if(shot.files[0])f.append("screenshot",shot.files[0]);try{await api("/api/deposits",{method:"POST",body:f});alert("Request sent to admin for verification.")}catch(e){alert(e.message)}}
function profile(){app.innerHTML=shell(`<div class="card"><h2>Profile</h2><p>${me.email}</p><p>Role: <b>${me.role}</b></p>${me.role==="customer"?'<button onclick="requestReseller()">Become D-Seller / Reseller</button>':''}</div>`)}
function requestReseller(){alert("In the next step, we can add an admin-configurable reseller activation fee and payment/approval workflow.");}
async function admin(){let [p,d]=await Promise.all([api("/api/admin/products"),api("/api/admin/deposits")]);app.innerHTML=shell(`<div class="card"><h2>Admin Panel</h2><h3>Add Product</h3><input id="pn" placeholder="Product name"><input id="pi" placeholder="Image URL"><textarea id="pd" placeholder="Description"></textarea><textarea id="plans" placeholder="One plan per line: 1 Hour|60|50"></textarea><button onclick="addProduct()">ADD PRODUCT</button></div><div class="card"><h3>Add Keys</h3><input id="pid" placeholder="Product ID"><textarea id="keysbox" rows="8" placeholder="Paste keys here — one key per line"></textarea><button onclick="addKeys()">ADD KEYS</button></div><div class="card"><h3>Products</h3>${p.map(x=>`<p>#${x.id} ${x.name} — available keys: ${x.available_keys}</p>`).join("")}</div><div class="card"><h3>Deposit Requests</h3>${d.map(x=>`<div class="card"><b>${x.email}</b> — ₹${x.amount} — ${x.status} — UTR: ${x.utr}<br>${x.status==="pending"?`<button class="ok" onclick="review(${x.id},'approve')">APPROVE</button><button class="danger" onclick="review(${x.id},'reject')">REJECT</button>`:''}</div>`).join("")||"No requests."}</div>`)}
async function addProduct(){try{let plans=(plans.value||"").split("\\n").map(line=>line.trim()).filter(Boolean).map(x=>{let [name,customer_price,reseller_price]=x.split("|");return{name,customer_price:Number(customer_price),reseller_price:Number(reseller_price)}});await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pn.value,image_url:pi.value,description:pd.value,plans})});alert("Product added");admin()}catch(e){alert(e.message)}}
async function addKeys(){try{let j=await api("/api/admin/keys",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:pid.value,keys:keysbox.value})});alert(j.added+" keys added");admin()}catch(e){alert(e.message)}}
async function review(id,a){try{await api("/api/admin/deposits/"+id+"/"+a,{method:"POST"});admin()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem("token");me=null;login()}
boot();
</script></body></html>
